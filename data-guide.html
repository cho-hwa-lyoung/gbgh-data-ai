<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<script>
/* 데이터 길잡이 · Google 로그인 + Apps Script 어댑터
   페이지가 기대하는 window.claude.use("db" | "user" | "sample")를 다시 만든다.
   - 로그인: "Google로 로그인"(GSI). 한 번 계정을 고르면 다음부터는 자동으로 로그인된다.
   - db: 문서 읽기·쓰기는 Apps Script 서버(doPost), 실시간 갱신은 몇 초 간격 확인으로 대신한다.
   - user: 로그인한 구글 계정으로 학생/교사를 구분한다 (판단은 서버가 한다).
   - sample: Claude API는 서버가 부르고, 데이터 도구는 이 브라우저에서 실행한다.
   APP_URL과 CLIENT_ID는 build.py가 config.json에서 채운다. */
(function () {
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzIwG1PtqFtSFAKGOKa-KRtla7Z40Y0vN_711Hya34Dwj11ZFInf6yUJoUMsbNA-jDT/exec';
  const CLIENT_ID = '451711767521-dvaqgjjd67ffvckht1el6ite7g0rdpv1.apps.googleusercontent.com';
  if (!/^https:/.test(APP_URL) || !CLIENT_ID) { console.warn('데이터 길잡이: config.json에 APP_URL과 CLIENT_ID를 채운 뒤 build.py를 실행하세요.'); return; }

  const POLL = { doc: 15000, config: 20000, list: 10000 };
  const TRANSIENT = /(simultaneous|too many times|timed out|timeout|NetworkError|network|Failed to fetch|503|서버 오류)/i;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- 로그인 (Google Identity Services) ---------- */
  const TOKEN_KEY = 'dg-id-token';
  let token = null, tokenExp = 0, loginWaiters = [], gsiReady = null;
  function parseExp(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } }
  function setToken(t) {
    token = t; tokenExp = parseExp(t);
    try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) { /* 저장 못 해도 이번 방문은 쓴다 */ }
    hideGate();
    loginWaiters.splice(0).forEach(r => r());
  }
  function haveToken() { return token && tokenExp - 60000 > Date.now(); }
  function loadGsi() {
    if (gsiReady) return gsiReady;
    gsiReady = new Promise((res, rej) => {
      if (window.google && google.accounts && google.accounts.id) return res();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
      s.onload = () => res(); s.onerror = () => rej(new Error('구글 로그인 스크립트를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'));
      document.head.appendChild(s);
    }).then(() => {
      google.accounts.id.initialize({
        client_id: CLIENT_ID, callback: r => setToken(r.credential),
        auto_select: true, cancel_on_tap_outside: false, itp_support: true, use_fedcm_for_prompt: true,
      });
    });
    return gsiReady;
  }
  let gate = null;
  function showGate(msg) {
    if (!document.body) { document.addEventListener('DOMContentLoaded', () => showGate(msg)); return; }
    if (!gate) {
      gate = document.createElement('div');
      gate.setAttribute('role', 'dialog'); gate.setAttribute('aria-label', '로그인');
      gate.style.cssText = 'position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(15,20,27,.55);padding:16px';
      gate.innerHTML = '<div style="background:var(--surface,#fff);color:var(--ink,#16202b);border-radius:14px;padding:26px 24px;max-width:380px;width:100%;display:grid;gap:12px;text-align:center;font:15px/1.6 system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.25)">'
        + '<b style="font-size:19px">데이터 길잡이</b><p id="dg-gate-msg" style="margin:0;color:var(--muted,#6a7684);font-size:14px">학교 구글 계정으로 로그인해 주세요.</p><div id="dg-gate-btn" style="display:flex;justify-content:center"></div></div>';
      document.body.appendChild(gate);
      loadGsi().then(() => google.accounts.id.renderButton(gate.querySelector('#dg-gate-btn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ko' })).catch(e => { gate.querySelector('#dg-gate-msg').textContent = e.message; });
    }
    if (msg) gate.querySelector('#dg-gate-msg').textContent = msg;
    gate.style.display = 'grid'; // 인라인 display가 있어 hidden 속성으로는 숨겨지지 않는다
  }
  function hideGate() { if (gate) gate.style.display = 'none'; }
  /** 토큰이 없거나 곧 만료되면: 자동 로그인(One Tap)을 시도하고, 안 되면 로그인 창을 띄운 채 기다린다. */
  async function ensureLogin(reason) {
    if (haveToken()) return token;
    try { const t = sessionStorage.getItem(TOKEN_KEY); if (t && parseExp(t) - 60000 > Date.now()) { token = t; tokenExp = parseExp(t); return token; } } catch (e) { /* 무시 */ }
    const wait = new Promise(r => loginWaiters.push(r));
    try {
      await loadGsi();
      google.accounts.id.prompt(n => { // 자동 로그인이 뜨지 않거나 건너뛰면 버튼 창으로
        if (!haveToken() && n && ((n.isNotDisplayed && n.isNotDisplayed()) || (n.isSkippedMoment && n.isSkippedMoment()))) showGate(reason);
      });
      setTimeout(() => { if (!haveToken()) showGate(reason); }, 2500); // FedCM 등에서 알림이 오지 않을 때 대비
    } catch (e) { showGate(e.message); }
    await wait;
    return token;
  }

  /* ---------- 서버 호출 ---------- */
  function toErr(msg) {
    msg = String(msg || '');
    const m = /\[([a-z_]+)\]\s*([\s\S]*)$/.exec(msg);
    const err = new Error(m ? m[2] : msg);
    err.code = m ? m[1] : (TRANSIENT.test(msg) ? 'network' : 'server');
    return err;
  }
  async function run(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    const t = await ensureLogin();
    let res, text;
    try {
      // Content-Type을 text/plain으로 보내야 브라우저가 사전 요청(preflight) 없이 Apps Script에 닿는다
      res = await fetch(APP_URL, { method: 'POST', body: JSON.stringify({ token: t, fn: fn, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' });
      text = await res.text();
    } catch (e) { throw toErr('network: ' + e.message); }
    let out;
    try { out = JSON.parse(text); } catch (e) { throw toErr(res.status >= 500 ? '서버 오류 ' + res.status : '[server] 서버 응답을 읽지 못했어요. 배포 설정(액세스: 모든 사용자)을 확인해 주세요.'); }
    if (out.ok) return out.result;
    const err = toErr(out.error);
    if (err.code === 'token_expired') { token = null; tokenExp = 0; try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* 무시 */ } }
    throw err;
  }
  async function call(fn) {
    const args = Array.prototype.slice.call(arguments);
    for (let i = 0; ; i++) {
      try { return await run.apply(null, args); }
      catch (e) {
        if (e.code === 'token_expired' && i < 2) { await ensureLogin('로그인이 만료됐어요. 다시 로그인해 주세요.'); continue; }
        if ((e.code !== 'network' && e.code !== 'server') || i >= 3 || !TRANSIENT.test(e.message)) throw e;
        await sleep(1200 * Math.pow(2, i) + Math.random() * 600); // 반 전체가 동시에 누를 때를 대비한 재시도
      }
    }
  }
  const clone = v => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));

  /* ---------- db ---------- */
  function snapOf(path, r) {
    return { id: path.split('/').pop(), exists: !!(r && r.exists), data: () => clone(r && r.data) };
  }
  function poll(load, every, onChange, onError) {
    let stopped = false, last = null, first = true;
    async function tick() {
      if (stopped) return;
      if (first || !document.hidden) { // 첫 조회는 항상, 그 뒤로는 화면을 보고 있을 때만
        first = false;
        try { const r = await load(); const sig = r.sig; if (sig !== last) { last = sig; onChange(r.value); } }
        catch (e) { if (onError) onError(e); }
      }
      if (!stopped) setTimeout(tick, every);
    }
    tick();
    return function () { stopped = true; };
  }
  const db = {
    doc(path) {
      return {
        get: async () => snapOf(path, await call('api_get', path)),
        set: data => call('api_set', path, clone(data)),
        update: data => call('api_update', path, clone(data)),
        onSnapshot(cb, onError) {
          return poll(async () => { const r = await call('api_get', path); return { sig: r.exists ? r.ts : 0, value: snapOf(path, r) }; },
            path === 'config/class' ? POLL.config : POLL.doc, cb, onError);
        },
      };
    },
    collection(name) {
      return {
        onSnapshot(cb, onError) {
          return poll(async () => {
            const list = await call('api_list', name);
            return { sig: list.map(d => d.id + ':' + d.ts).sort().join(','), value: { docs: list.map(d => ({ id: d.id, data: () => clone(d.data) })) } };
          }, POLL.list, cb, onError);
        },
      };
    },
  };

  /* ---------- user ---------- */
  let who = null;
  const whoami = () => (who = who || call('api_whoami'));
  const user = {
    id: async () => (await whoami()).uid,
    canEdit: async () => !!(await whoami()).teacher,
    profiles: ids => call('api_profiles', ids || []),
  };

  /* ---------- sample (Claude) ---------- */
  function normalize(input) {
    if (typeof input === 'string') return [{ role: 'user', content: input }];
    return (input || []).map(m => ({ role: m.role, content: m.content }));
  }
  function cancelled() { const e = new Error('cancelled'); e.code = 'cancelled'; return e; }
  function parseJSON(text) {
    const t = String(text || '').replace(/```(?:json)?/gi, '').trim();
    const start = t.search(/[\[{]/);
    if (start < 0) throw Object.assign(new Error('invalid_json'), { code: 'invalid_json' });
    const open = t[start], close = open === '[' ? ']' : '}';
    const end = t.lastIndexOf(close);
    try { return JSON.parse(t.slice(start, end + 1)); }
    catch (e) { throw Object.assign(new Error('invalid_json'), { code: 'invalid_json', text: text }); }
  }
  async function reveal(text, onText, signal) { // 서버는 답을 한 번에 돌려주므로, 화면에서는 짧게 흘려 보여 준다
    const steps = Math.min(24, Math.max(1, Math.ceil(text.length / 40)));
    for (let i = 1; i <= steps; i++) {
      if (signal && signal.aborted) break;
      onText({ text: text.slice(0, Math.round(text.length * i / steps)) });
      await sleep(25);
    }
    onText({ text: text });
  }
  /* 수행 과정 기록: AI 대화 한 번(질문 → 최종 답변)을 서버의 ai_log 시트에 남긴다. 실패해도 수업은 계속된다. */
  function describe(input, opts, asJSON) {
    const page = typeof S !== 'undefined' ? S : {};
    const isArr = Array.isArray(input);
    const lastUser = isArr ? [...input].reverse().find(m => m.role === 'user' && typeof m.content === 'string') : null;
    return {
      stage: page.view === 'student' ? page.cur : '',
      req: isArr && page.req && typeof REQ !== 'undefined' ? REQ[page.req] : '',
      kind: opts.modelTier === 'quick' ? 'AI 활용 기록 초안' : isArr ? (asJSON ? '대화(함정 모드)' : '대화') : asJSON ? '피드백 점검' : '학급 분석(교사)',
      question: isArr && input.length > 1 && lastUser ? lastUser.content : '',
    };
  }
  async function ask(input, opts, asJSON) {
    opts = opts || {};
    const info = describe(input, opts, asJSON);
    const stat = { input: 0, output: 0, tools: [], model: '' };
    const send = (reply, extra) => run('api_logAI', Object.assign({}, info, stat, { reply: reply }, extra || {})).catch(() => {});
    try {
      const out = await askInner(input, opts, asJSON, stat);
      const reply = asJSON ? (out && out.reply !== undefined ? out.reply : JSON.stringify(out)) : out.text;
      send(reply, { trap: asJSON && out && out.trap ? out.trap : '' });
      return out;
    } catch (e) {
      send('', { result: e.code === 'cancelled' ? '학생이 멈춤' : '오류: ' + (e.code || '') + ' ' + e.message });
      throw e;
    }
  }
  async function askInner(input, opts, asJSON, stat) {
    const signal = opts.signal;
    const messages = normalize(input);
    const tools = (opts.tools || []).map(t => ({ name: t.name, description: t.description || '', input_schema: t.inputSchema || { type: 'object', properties: {} } }));
    const byName = {}; (opts.tools || []).forEach(t => { byName[t.name] = t; });
    const system = asJSON ? '답변은 설명이나 코드 블록 없이 JSON 하나만 출력하세요.' : undefined;
    const tier = opts.modelTier === 'quick' ? 'quick' : undefined;
    const effort = tier ? 'low' : asJSON ? 'medium' : 'low';
    let res = null;
    for (let turn = 0; turn < 6; turn++) {
      if (signal && signal.aborted) throw cancelled();
      res = await call('api_claude', { messages: messages, system: system, tools: tools, tier: tier, effort: effort, count: turn === 0 });
      stat.model = res.model || stat.model;
      if (res.usage) { stat.input += res.usage.input; stat.output += res.usage.output; }
      res.content.filter(b => b.type === 'tool_use').forEach(b => { if (stat.tools.indexOf(b.name) < 0) stat.tools.push(b.name); });
      if (signal && signal.aborted) throw cancelled();
      messages.push({ role: 'assistant', content: res.content }); // 받은 내용 그대로 이어 붙인다 (편집하지 않음)
      const uses = res.content.filter(b => b.type === 'tool_use');
      if (res.stop_reason !== 'tool_use' || !uses.length) break;
      const results = [];
      for (const b of uses) {
        const tool = byName[b.name];
        try {
          if (!tool) throw new Error('없는 도구: ' + b.name);
          const out = await tool.execute(b.input || {}, {});
          results.push({ type: 'tool_result', tool_use_id: b.id, content: JSON.stringify(out === undefined ? null : out) });
        } catch (e) {
          results.push({ type: 'tool_result', tool_use_id: b.id, content: String(e && e.message || e), is_error: true });
        }
      }
      messages.push({ role: 'user', content: results });
    }
    const text = res.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    if (asJSON) return parseJSON(text);
    if (opts.onText) await reveal(text, opts.onText, signal);
    return { text: text };
  }
  const sample = (input, opts) => ask(input, opts, false);
  sample.json = (input, opts) => ask(input, opts, true);
  sample.limits = async () => ({ tools: true });

  const caps = { db: db, user: user, sample: sample };
  window.claude = {
    use: async name => {
      if (!(name in caps)) return null;
      await whoami(); // 로그인·도메인 오류는 여기서 드러난다
      return caps[name];
    },
  };
  /* 교사 계정에만: 기록 시트 열기, 관찰 시트 정리, 지금 백업 */
  function teacherDock(w) {
    const box = document.createElement('div');
    box.setAttribute('aria-label', '수행 기록 관리');
    box.style.cssText = 'position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100vw - 28px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:13px';
    const msg = document.createElement('span');
    msg.className = 'muted';
    const link = (text, href) => { const a = document.createElement('a'); a.className = 'btn sm'; a.textContent = text; a.href = href; a.target = '_blank'; a.rel = 'noopener'; return a; };
    const btn = (text, fn, busy) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn sm'; b.textContent = text;
      b.addEventListener('click', async () => {
        b.disabled = true; msg.textContent = busy;
        try { msg.textContent = await fn(); } catch (e) { msg.textContent = '실패: ' + e.message; }
        b.disabled = false;
      });
      return b;
    };
    box.append(
      link('기록 시트 ↗', w.sheetUrl),
      btn('관찰 시트 정리', async () => { const r = await call('api_teacherRefresh'); return '학생 ' + r.students + '명 · ' + r.rows + '행 정리함'; }, '정리하는 중…'),
      btn('지금 백업', async () => { const r = await call('api_teacherBackup'); box.insertBefore(link('백업 폴더 ↗', r.folderUrl), msg); return r.name + ' 저장함'; }, '백업하는 중…'),
      msg);
    if (w.backupUrl) box.insertBefore(link('백업 폴더 ↗', w.backupUrl), msg);
    document.body.appendChild(box);
  }
  /* ---------- 오른쪽 위 계정 칩 (구글 서비스의 계정 버튼과 같은 방식) ---------- */
  function tokenProfile() { // 표시용 이름·사진은 로그인 토큰에서 읽는다 (권한 판단은 서버가 한다)
    try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { return {}; }
  }
  function accountChip(w) {
    if (document.getElementById('dg-acct')) return;
    const p = tokenProfile(), name = p.name || w.name || w.email.split('@')[0], initial = (name || w.email).trim().charAt(0).toUpperCase();
    const avatar = size => {
      const el = document.createElement(p.picture ? 'img' : 'span');
      el.style.cssText = 'width:' + size + 'px;height:' + size + 'px;border-radius:50%;display:grid;place-items:center;background:#2446a8;color:#fff;font:600 ' + Math.round(size * .45) + 'px/1 system-ui,sans-serif;object-fit:cover;flex:none;user-select:none';
      if (p.picture) { el.src = p.picture; el.alt = ''; el.referrerPolicy = 'no-referrer'; el.onerror = () => { el.replaceWith(Object.assign(document.createElement('span'), { textContent: initial, style: el.style.cssText })); }; }
      else el.textContent = initial;
      return el;
    };
    const wrap = document.createElement('div');
    wrap.id = 'dg-acct';
    wrap.style.cssText = 'position:relative;display:inline-flex;align-items:center;margin-left:6px';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.title = w.email; btn.setAttribute('aria-label', '계정: ' + w.email); btn.setAttribute('aria-haspopup', 'true'); btn.setAttribute('aria-expanded', 'false');
    btn.style.cssText = 'border:0;background:transparent;padding:3px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:background .15s';
    btn.onmouseenter = () => { btn.style.background = 'rgba(128,128,128,.18)'; }; btn.onmouseleave = () => { btn.style.background = 'transparent'; };
    btn.appendChild(avatar(32));
    const menu = document.createElement('div');
    menu.setAttribute('role', 'menu');
    menu.style.cssText = 'display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:45;width:min(320px,calc(100vw - 32px));background:var(--surface,#fff);color:var(--ink,#16202b);border:1px solid var(--line,#d7dde4);border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:18px 14px 12px;text-align:center;font:14px/1.5 system-ui,sans-serif';
    const big = avatar(72); big.style.margin = '0 auto 10px';
    const nm = document.createElement('div'); nm.textContent = (name.length > 1 ? name + '님, ' : '') + '안녕하세요'; nm.style.cssText = 'font-size:18px;font-weight:600';
    const em = document.createElement('div'); em.textContent = w.email; em.style.cssText = 'color:var(--muted,#6a7684);font-size:13px;margin:2px 0 14px;overflow-wrap:anywhere';
    const role = document.createElement('div'); role.textContent = w.teacher ? '교사 계정 · 학급 전체를 볼 수 있어요' : '학생 계정 · 내 기록만 저장돼요'; role.style.cssText = 'font-size:12.5px;color:var(--muted,#6a7684);margin-bottom:12px';
    const item = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem'); b.textContent = label; b.style.cssText = 'width:100%;border:1px solid var(--line,#d7dde4);background:var(--surface,#fff);color:inherit;border-radius:999px;padding:9px 12px;margin-top:6px;cursor:pointer;font:inherit;font-weight:500'; b.onmouseenter = () => { b.style.background = 'var(--surface-2,#eef1f5)'; }; b.onmouseleave = () => { b.style.background = 'var(--surface,#fff)'; }; b.onclick = fn; return b; };
    const signOut = async () => {
      close();
      token = null; tokenExp = 0; who = null;
      try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* 무시 */ }
      try { await loadGsi(); google.accounts.id.disableAutoSelect(); } catch (e) { /* 무시 */ }
      location.reload(); // 화면 상태를 비우고 로그인 창부터 다시 시작한다
    };
    menu.append(big, nm, em, role, item('다른 계정으로 로그인', signOut), item('로그아웃', signOut));
    const note = document.createElement('div'); note.textContent = '기록은 이 계정에만 저장돼요'; note.style.cssText = 'font-size:11.5px;color:var(--muted,#6a7684);margin-top:10px';
    menu.appendChild(note);
    function open() { menu.style.display = 'block'; btn.setAttribute('aria-expanded', 'true'); setTimeout(() => document.addEventListener('click', onDoc), 0); document.addEventListener('keydown', onKey); }
    function close() { menu.style.display = 'none'; btn.setAttribute('aria-expanded', 'false'); document.removeEventListener('click', onDoc); document.removeEventListener('keydown', onKey); }
    function onDoc(e) { if (!wrap.contains(e.target)) close(); }
    function onKey(e) { if (e.key === 'Escape') { close(); btn.focus(); } }
    btn.onclick = () => (menu.style.display === 'block' ? close() : open());
    wrap.append(btn, menu);
    const top = document.querySelector('.top');
    if (top) { // 구글 서비스처럼 머리글 맨 오른쪽에 둔다: 제목은 왼쪽, 상태·역할 전환은 오른쪽, 계정은 그 끝
      top.style.justifyContent = 'flex-start';
      const row = top.querySelector('.row'); if (row) row.style.marginLeft = 'auto';
      wrap.style.marginLeft = row ? '4px' : 'auto';
      top.appendChild(wrap);
    } else document.body.appendChild(wrap);
  }
  whoami().then(w => {
    const mount = () => { accountChip(w); if (w.teacher) teacherDock(w); };
    if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
  }, () => {});

  whoami().catch(e => {
    window.claude = undefined;
    const box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:50;max-width:calc(100vw - 32px);background:#b3261e;color:#fff;padding:10px 14px;border-radius:10px;font:14px/1.5 system-ui,sans-serif';
    box.textContent = '연결하지 못했어요: ' + e.message;
    document.addEventListener('DOMContentLoaded', () => document.body.appendChild(box));
    if (document.body) document.body.appendChild(box);
  });
})();

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function sampleHabits(){
  const r=rng(2026),cols=["학번","학년","수면시간","스마트폰사용시간","주간운동일수","아침식사","집중도점수"],rows=[];
  for(let i=0;i<80;i++){const sleep=Math.round(clamp(6.5+1.1*gauss(r),3.5,9.5)*2)/2,phone=Math.round(clamp(4-(sleep-6.5)*.6+1.4*gauss(r),.5,10)*2)/2,ex=Math.floor(r()*8),bf=r()<.6,focus=Math.round(clamp(50+6*(sleep-6.5)-3*(phone-4)+1.5*ex+(bf?4:0)+8*gauss(r),0,100));
    rows.push(["S"+String(i+1).padStart(3,"0"),String(1+Math.floor(r()*3)),String(sleep),String(phone),String(ex),bf?"예":"아니오",String(focus)])}
  [5,23,38,51,66].forEach(i=>rows[i][2]="");[12,47,70].forEach(i=>rows[i][6]="");rows[17][2]="25";rows[42][3]="30";[8,29,61].forEach(i=>rows[i][1]=rows[i][1]+"학년");
  return {name:"학생 생활습관과 집중도 (가상 예시 데이터, 80명)",cols,rows,sample:true};
}
function sampleDust(){
  const r=rng(77),cols=["지역","월","PM10","PM2.5","강수량mm"],rows=[],base={"가람구":48,"나래구":41,"다솔구":55};
  for(const g of Object.keys(base))for(let m=1;m<=12;m++){const season=Math.cos((m-2.5)/12*2*Math.PI),rain=Math.round(clamp(90-70*season+25*gauss(r),5,320)),pm10=Math.round(clamp(base[g]+18*season-.05*rain+6*gauss(r),12,120));rows.push([g,String(m),String(pm10),String(Math.round(pm10*.48+3*gauss(r))),String(rain)])}
  rows[7][2]="";rows[19][3]="";rows[30][2]="999";
  return {name:"우리 동네 월별 미세먼지 (가상 예시 데이터, 36행)",cols,rows,sample:true};
}

function parseCSV(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&text[i+1]=='\n')i++;row.push(f);f="";if(row.some(x=>x!==""))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x!==""))rows.push(row);const cols=(rows.shift()||[]).map((c,i)=>c.trim()||("열"+(i+1)));return {cols,rows:rows.slice(0,5000).map(r=>cols.map((_,i)=>(r[i]??"").trim()))}}
const isNum=v=>v!==""&&v!=null&&!isNaN(Number(v));
function colIdx(n){return S.data?S.data.cols.indexOf(String(n)):-1}
function colType(i){const v=S.data.rows.map(r=>r[i]).filter(x=>x!=="");if(!v.length)return"빈 열";return v.filter(isNum).length/v.length>=.8?"수치":"범주"}
function nums(i){return S.data.rows.map(r=>r[i]).filter(isNum).map(Number)}
function quant(a,p){const s=[...a].sort((x,y)=>x-y),k=(s.length-1)*p,f=Math.floor(k);return s[f]+(s[Math.min(f+1,s.length-1)]-s[f])*(k-f)}
function describe(i){const raw=S.data.rows.map(r=>r[i]),miss=raw.filter(v=>v==="").length,type=colType(i);
  if(type==="수치"){const a=nums(i),n=a.length,mean=a.reduce((x,y)=>x+y,0)/n,sd=Math.sqrt(a.reduce((s,x)=>s+(x-mean)**2,0)/(n-1||1)),q1=quant(a,.25),q3=quant(a,.75),iqr=q3-q1,out=a.filter(x=>x<q1-1.5*iqr||x>q3+1.5*iqr);
    return {column:S.data.cols[i],type,n,missing:miss,mean:+fmt(mean),median:+fmt(quant(a,.5)),sd:+fmt(sd),min:Math.min(...a),max:Math.max(...a),q1:+fmt(q1),q3:+fmt(q3),outliers_iqr:out.length,outlier_examples:[...new Set(out)].slice(0,5),non_numeric_values:[...new Set(raw.filter(v=>v!==""&&!isNum(v)))].slice(0,5)}}
  const cnt={};raw.filter(v=>v!=="").forEach(v=>cnt[v]=(cnt[v]||0)+1);return {column:S.data.cols[i],type,missing:miss,distinct:Object.keys(cnt).length,counts:Object.fromEntries(Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,12))}}
function overview(){if(!S.data)return{loaded:false};return{loaded:true,name:S.data.name,rows:S.data.rows.length,columns:S.data.cols.map((c,i)=>({name:c,type:colType(i),missing:S.data.rows.filter(r=>r[i]==="").length})),first_rows:S.data.rows.slice(0,3)}}
function pearson(xi,yi){const p=S.data.rows.filter(r=>isNum(r[xi])&&isNum(r[yi])).map(r=>[+r[xi],+r[yi]]),n=p.length;if(n<3)return{n,r:null};const mx=p.reduce((s,a)=>s+a[0],0)/n,my=p.reduce((s,a)=>s+a[1],0)/n;let sxy=0,sxx=0,syy=0;for(const[x,y]of p){sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2}return{n,r:+fmt(sxy/Math.sqrt(sxx*syy),3)}}
function groupSum(gi,vi){const g={};for(const r of S.data.rows){if(r[gi]==="")continue;(g[r[gi]]??=[]);if(vi>=0&&isNum(r[vi]))g[r[gi]].push(+r[vi]);else if(vi<0)g[r[gi]].push(1)}
  return Object.entries(g).map(([k,a])=>({group:k,n:a.length,mean:vi>=0&&a.length?+fmt(a.reduce((x,y)=>x+y,0)/a.length):null})).sort((a,b)=>isNum(a.group)&&isNum(b.group)?a.group-b.group:a.group.localeCompare(b.group,"ko"))}
function buildChart(type,x,y){const xi=colIdx(x),yi=y?colIdx(y):-1;if(xi<0)throw new Error("열 '"+x+"'을 찾을 수 없어요.");
  if(type==="histogram"){const a=nums(xi);if(a.length<2)throw new Error("수치 값이 부족해요.");const mn=Math.min(...a),mx=Math.max(...a),k=10,w=(mx-mn)/k||1,bins=Array.from({length:k},(_,j)=>({label:fmt(mn+j*w,1)+"~"+fmt(mn+(j+1)*w,1),v:0}));a.forEach(v=>bins[Math.min(k-1,Math.floor((v-mn)/w))].v++);return{type,x,title:x+" 분포 (히스토그램)",bars:bins,yLabel:"빈도"}}
  if(type==="bar"||type==="line"){const g=groupSum(xi,yi);if(!g.length)throw new Error("그릴 값이 없어요.");return{type,x,y,title:y?(x+"별 "+y+" 평균"):(x+"별 개수"),bars:g.map(d=>({label:d.group,v:y?d.mean:d.n,n:d.n})),yLabel:y?y+" 평균":"개수"}}
  if(type==="scatter"){if(yi<0)throw new Error("산점도는 y 열이 필요해요.");return{type,x,y,title:x+"와 "+y+"의 관계 (산점도)",pts:S.data.rows.filter(r=>isNum(r[xi])&&isNum(r[yi])).map(r=>({x:+r[xi],y:+r[yi]})),r:pearson(xi,yi).r}}
  throw new Error("지원하지 않는 그래프예요.")}
function agentTools(){return [
  {name:"get_data_overview",description:"학생이 불러온 데이터의 이름, 행 수, 열 이름·자료형·결측 수, 첫 3행을 돌려준다.",execute:()=>overview()},
  {name:"column_stats",description:"한 열의 기술통계(수치: 평균·중앙값·표준편차·사분위·IQR 이상치 수·숫자가 아닌 값 / 범주: 빈도).",inputSchema:{type:"object",properties:{column:{type:"string"}},required:["column"]},execute:({column})=>{const i=colIdx(column);if(i<0)throw new Error("없는 열: "+column);return describe(i)}},
  {name:"group_compare",description:"group 열 범주별로 value 열의 개수·평균. value를 비우면 개수만.",inputSchema:{type:"object",properties:{group:{type:"string"},value:{type:"string"}},required:["group"]},execute:({group,value})=>{const gi=colIdx(group);if(gi<0)throw new Error("없는 열: "+group);return groupSum(gi,value?colIdx(value):-1)}},
  {name:"correlation",description:"두 수치 열의 피어슨 상관계수 r과 쌍의 수 n.",inputSchema:{type:"object",properties:{x:{type:"string"},y:{type:"string"}},required:["x","y"]},execute:({x,y})=>{const a=colIdx(x),b=colIdx(y);if(a<0||b<0)throw new Error("열 이름을 확인하세요");return pearson(a,b)}}
 ]}

function fluency(p){
  const ss=Object.values(p.stages||{});const sum=k=>ss.reduce((a,s)=>a+(s[k]||0),0);
  const msgs=sum("msgs"),r=ss.reduce((a,s)=>{for(const k in s.rated||{})a[k]+=s.rated[k]||0;return a},{adopt:0,edit:0,reject:0,verify:0});
  const rated=r.adopt+r.edit+r.reject+r.verify,thoughts=ss.filter(s=>s.thought).length,started=ss.filter(s=>s.msgs).length||1;
  const traps=ss.reduce((a,s)=>({shown:a.shown+((s.traps||{}).shown||0),found:a.found+((s.traps||{}).found||0)}),{shown:0,found:0});
  const logs=ss.flatMap(s=>s.log||[]),logDone=logs.filter(l=>(l.fix||"").trim()&&(l.verify||"").trim()).length;
  const del=msgs?Math.min(1,(sum("reqTyped")/msgs)*.6+Math.min(1,thoughts/started)*.4):0;
  const des=msgs?Math.min(1,sum("promptScore")/(msgs*3)):0;
  const dis=rated?Math.min(1,((r.edit+r.reject+r.verify)/rated)*.7+(traps.shown?traps.found/traps.shown:0)*.3):0;
  const dil=logs.length?logDone/logs.length:0;
  return {del,des,dis,dil,msgs,rated,r,traps,logs:logs.length};
}
function fluencyHTML(f){return `<div class="fluency">${Object.entries(FLUENCY).map(([k,v])=>`<div class="fl"><b>${v.n} <span class="mono" style="font-weight:400">${Math.round(f[k]*100)}</span></b><small>${v.d}</small><div class="bar"><i style="width:${Math.round(f[k]*100)}%"></i></div></div>`).join("")}</div>`}

  $("#chartMeta").innerHTML=(c.pts?`<p style="margin:6px 0 0;font-size:13.5px">점 ${c.pts.length}개 · 상관계수 r = <b class="mono">${fmt(c.r,3)}</b> <span class="muted">(상관은 인과가 아니에요)</span></p>`:"")+`<details style="margin-top:6px"><summary>표로 보기</summary><div class="tablewrap" style="margin-top:6px"><table><thead><tr>${c.pts?`<th>${esc(c.x)}</th><th>${esc(c.y)}</th>`:`<th>${esc(c.x)}</th><th>${esc(c.yLabel)}</th>`}</tr></thead><tbody>${c.pts?c.pts.slice(0,200).map(p=>`<tr><td>${p.x}</td><td>${p.y}</td></tr>`).join(""):c.bars.map(b=>`<tr><td>${esc(b.label)}</td><td>${fmt(b.v)}</td></tr>`).join("")}</tbody></table></div></details>`;

async function send(textOverride){
  const inp=$("#chatIn");let text=(textOverride||inp.value).trim();if(!text||S.busy||!S.sample)return;
  const id=S.cur,x=st(),c=await loadChat(id),cfg=S.config.stages[id],cap=+cfg.cap||1;
  const ps=promptScore(text);
  if(!textOverride&&ps<=1&&text.length<25&&!S.coachShown){S.coachShown=true;$("#coach").innerHTML=`<div class="coach">질문을 더 좋게 만들어 볼까요? <b>맥락</b>(내 주제·데이터), <b>목적</b>(무엇을 알고 싶은지), <b>원하는 형태</b>(예: 위젯 이름만)를 넣으면 더 정확한 도움을 받아요. 그대로 보내려면 한 번 더 누르세요.</div>`;return}
  S.coachShown=false;$("#coach").innerHTML="";
  let hint=Math.min(cap,Math.max(S.hint[id]||1,S.req&&EXTRANEOUS.includes(S.req)?2:1));
  if(/(정답|답\s*(을|좀)?\s*(알려|말해)|대신\s*(써|작성|해|만들)|써\s*줘|작성해\s*줘|만들어\s*줘|그려\s*줘)/.test(text))x.seek++;
  x.msgs++;x.promptScore+=ps;if(S.req)x.reqTyped++;x.maxHint=Math.max(x.maxHint||0,hint);
  c.turns.push({role:"user",content:text,at:Date.now(),req:S.req,hint});if(!textOverride)inp.value="";
  const trap=cfg.trap&&(c.turns.filter(t=>t.role==="assistant").length%2===0);
  const turn={role:"assistant",content:"",pending:true,at:Date.now()};c.turns.push(turn);renderChat();
  S.busy=true;S.ctl=new AbortController();$("#stopBtn").hidden=false;$("#sendBtn").disabled=true;
  const hist=c.turns.slice(0,-1).slice(-14).filter(t=>t.content).map(t=>({role:t.role,content:t.content}));while(hist.length&&hist[0].role!=="user")hist.shift();
  const input=[{role:"user",content:rulesFor(id,trap,hint,S.req)},...hist];
  const used=[];const tools=S.toolsOK&&S.data?agentTools().map(t=>({...t,execute:(a,ctx)=>{used.push(t.name);return t.execute(a||{},ctx)}})):undefined;
  try{
    if(trap){const r=await S.sample.json(input,{signal:S.ctl.signal,tools});turn.content=String(r&&r.reply||"").trim()||"(빈 답변)";turn.trap=String(r&&r.trap||"");x.traps.shown++}
    else{const opts={signal:S.ctl.signal,onText:({text})=>{turn.content=text;const b=$("#msgs .msg.a:last-child .b");if(b)b.innerHTML=md(text)}};if(tools)opts.tools=tools;else opts.cache=false;const r=await S.sample(input,opts);turn.content=r.text}
  }catch(e){const m=sampleErr(e);turn.content=(e.text||"")+(m?`\n\n(${m})`:"");if(!turn.content.trim())c.turns.splice(c.turns.indexOf(turn),1)}
  turn.pending=false;if(used.length)turn.tools=[...new Set(used)];
  S.busy=false;S.ctl=null;renderChat();const sb=$("#stopBtn");if(sb){sb.hidden=true;$("#sendBtn").disabled=false}
  saveChat(id);scheduleSave();
}

function signals(p){
  const out=[],cur=(p.stages||{})[p.current]||{},f=fluency(p);
  if(p.hand)out.push(["bad","호출"+(p.handNote?": "+p.handNote:"")]);
  if((cur.seek||0)>=3)out.push(["warn","답 요구 "+cur.seek+"회"]);
  if(f.rated>=5&&f.r.adopt/f.rated>.8)out.push(["warn","AI 답 그대로 채택 多"]);
  if(f.msgs>=4&&!f.logs)out.push(["warn","AI 기록 없음"]);
  if(p.updatedAt&&Date.now()-p.updatedAt>15*60000&&!cur.done)out.push(["warn","15분 이상 정체"]);
  const autos=STAGES.reduce((a,s)=>a+autoFindings(s.id,(p.stages||{})[s.id]||{fields:{}},p).length,0);if(autos)out.push(["warn","자동 점검 "+autos+"건"]);
  return out;
}

  else if(t.dataset.log){const l=st().log[+t.dataset.i];if(l){l[t.dataset.log]=t.value;scheduleSave()}}
  else if(t.id==="nick"){S.me.nickname=t.value.slice(0,40);scheduleSave()}
  else if(t.id==="team"){S.me.team=t.value.slice(0,20);scheduleSave()}});
document.addEventListener("keydown",e=>{if(e.target.id==="chatIn"&&e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});
document.addEventListener("change",async e=>{if(e.target.id!=="csvIn")return;const f=e.target.files[0];if(!f)return;const buf=await f.arrayBuffer();let text=new TextDecoder("utf-8").decode(buf);
  if(text.includes(String.fromCharCode(0xFFFD))){try{text=new TextDecoder("euc-kr").decode(buf)}catch(err){}}
  const d=parseCSV(text.replace(/^﻿/,""));if(!d.cols.length||!d.rows.length){toast("CSV를 읽지 못했어요. 첫 줄이 열 이름인지 확인해 주세요");return}loadData({name:f.name,cols:d.cols,rows:d.rows})});
function readCfgForm(){S.config.topic=$("#cTopic").value.trim();S.config.announcement=$("#cAnn").value.trim();
  document.querySelectorAll("[data-cfg]").forEach(el=>{const k=S.config.stages[el.dataset.s];if(el.dataset.cfg==="cap")k.cap=+el.value;else if(el.dataset.cfg==="scope")k.scope=el.value.trim();else k[el.dataset.cfg]=el.checked})}
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(renderChart,150)});

/* ============================================================
   12. 시작
   ============================================================ */
render();
setStatus(false,"미리보기 모드 · 이 브라우저에만 저장");
(async()=>{
  if(!window.claude||!claude.use)return;
  const [db,user,sample]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
  S.user=user;S.sample=sample;
  if(sample){try{const l=await sample.limits();S.toolsOK=!!l.tools}catch(e){}}
  if(user){S.isTeacher=await user.canEdit().catch(()=>false);S.uid=await user.id().catch(()=>null)}
  if(db&&S.uid){
    S.db=db;S.local=false;setStatus(true,"연결됨 · 학급과 공유 중");
    try{const s=await db.doc("progress/"+S.uid).get();if(s.exists){S.docExists=true;const d=s.data(),b=blankMe();S.me={...b,...d,stages:Object.fromEntries(STAGES.map(t=>[t.id,{...blankStage(),...((d.stages||{})[t.id]||{})}]))};S.cur=STAGE[S.me.current]?S.me.current:"discover"}}catch(e){}
    db.doc("config/class").onSnapshot(s=>{if(s.exists){S.config=mergeConfig(s.data());if(S.view==="student"&&!document.activeElement?.matches("textarea,input"))renderStudent()}},()=>{});
    db.doc("progress/"+S.uid).onSnapshot(s=>{if(!s.exists)return;const d=s.data();S.me.nudges=d.nudges||[];S.me.teacherFb=d.teacherFb||{};
      if(d.handAck&&d.handAck>(S.me.handAt||0)&&S.me.hand){S.me.hand=false;const hb=$("#handBtn");if(hb){hb.textContent="선생님 호출";hb.classList.remove("primary")}}
      if(S.view==="student"){const nb=$("#nudgeBox");if(nb)nb.innerHTML=nudgeHTML((S.me.nudges||[]).filter(n=>n.at>(S.me.nudgeSeen||0)))}},()=>{});
    if(S.isTeacher){S.view="teacher";db.collection("progress").onSnapshot(q=>{S.students=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view==="teacher"&&!document.activeElement?.matches("#nudgeIn,input[id^=tfb-]")){if(S.tTab==="class")renderClass();else if(S.tTab==="review")renderReview()}},()=>{})}
  }else if(sample)setStatus(true,"AI 연결됨 · 저장은 이 브라우저에만");
  render();
})();
</script>
