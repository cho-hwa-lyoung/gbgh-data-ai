<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>경북여고 데이터·AI 교실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="경북여자고등학교 정보 수업 · 데이터와 인공지능 단원 차시별 교재와 인터랙티브 실험실">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 애플 제품 페이지처럼 넓은 여백 + 큰 타이포 + 단원별 색 타일. 홈(허브) ↔ 차시 페이지를 해시로 전환 */
:root{
  --bg:#fbfbfd; --surface:#ffffff; --surface2:#f2f2f6; --fg:#1d1d1f; --muted:#6e6e73; --line:rgba(20,20,40,.09); --grid:rgba(20,20,40,.07);
  --accent:#0066cc; --accent-ink:#ffffff; --nav:rgba(251,251,253,.78);
  --u1:#0a8f7a; --u2:#0066cc; --u3:#cf4f0e;
  --c1:#0071e3; --c2:#f56300; --c3:#0a9b80; --c4:#b4419a; --c5:#8a7a00;
  --good:#1e9e4a; --bad:#d70015; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
  --font:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#161618; --surface2:#232326; --fg:#f5f5f7; --muted:#a1a1a6; --line:rgba(255,255,255,.12); --grid:rgba(255,255,255,.08);
  --accent:#2997ff; --accent-ink:#000000; --nav:rgba(0,0,0,.72);
  --u1:#30c9a8; --u2:#2997ff; --u3:#ff8a3d;
  --c1:#2997ff; --c2:#ff9f45; --c3:#34d1ad; --c4:#e57bd0; --c5:#d8c84a;
  --good:#32d74b; --bad:#ff453a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#161618; --surface2:#232326; --fg:#f5f5f7; --muted:#a1a1a6; --line:rgba(255,255,255,.12); --grid:rgba(255,255,255,.08);
  --accent:#2997ff; --accent-ink:#000000; --nav:rgba(0,0,0,.72);
  --u1:#30c9a8; --u2:#2997ff; --u3:#ff8a3d;
  --c1:#2997ff; --c2:#ff9f45; --c3:#34d1ad; --c4:#e57bd0; --c5:#d8c84a;
  --good:#32d74b; --bad:#ff453a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--nav)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;letter-spacing:-.035em;line-height:1.12;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:52px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--fg);letter-spacing:-.02em;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand i{width:24px;height:24px;border-radius:7px;background:conic-gradient(from 200deg,var(--u1),var(--u2),var(--u3),var(--u1));display:block}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.nav nav{margin-left:auto;display:flex;gap:4px}
.nav nav a{font-size:13px;color:var(--fg);opacity:.8;padding:6px 10px;border-radius:999px;white-space:nowrap}
.nav nav a:hover{opacity:1;text-decoration:none;background:var(--surface2)}
.nav nav a.on{opacity:1;font-weight:600}
@media (max-width:560px){.brand small{display:none}.nav nav a{padding:6px 7px}}

/* buttons & controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .15s,filter .15s}
.btn:hover{text-decoration:none;filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.soft{background:var(--surface2);color:var(--fg)}
.btn.sm{padding:7px 14px;font-size:13px}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-b{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.seg-b.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;font-size:14px;min-width:0}
.sl-l{color:var(--muted)}
.sl output{font-variant-numeric:tabular-nums;font-weight:600}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);letter-spacing:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}

/* hero */
.hero{padding-block:72px 40px;text-align:center}
.hero .eyebrow{display:inline-block;margin-bottom:18px}
.hero h1{font-size:clamp(40px,7.4vw,84px);font-weight:800}
.grad{background:linear-gradient(100deg,var(--u1) 10%,var(--u2) 55%,var(--u3) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:clamp(17px,2.2vw,21px);color:var(--muted);max-width:640px;margin:22px auto 0;line-height:1.55}
.hero .cta{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.hero h1,.hero .lead,.hero .cta{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero .lead{animation-delay:.08s}.hero .cta{animation-delay:.16s}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.stage{margin-top:48px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;text-align:left}
.stage-bar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stage-bar .read{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage canvas{display:block;width:100%;cursor:crosshair;touch-action:manipulation}
.stage-cap{padding:12px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}

/* sections */
.sec{padding-block:64px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(30px,4.4vw,48px);font-weight:800}
.sec-h p{color:var(--muted);max-width:460px}
.progress{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 18px}
.progress svg{flex:none}
.progress b{font-size:20px;font-variant-numeric:tabular-nums}
.progress span{font-size:13px;color:var(--muted);display:block;line-height:1.3}

.unit{margin-top:40px}
.unit-h{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.unit-h .no{font-size:14px;font-weight:700;color:var(--uc)}
.unit-h h3{font-size:24px;font-weight:700}
.unit-h span{color:var(--muted);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.cards{grid-template-columns:1fr}}
.lcard{position:relative;display:flex;flex-direction:column;gap:6px;min-height:200px;padding:22px;border-radius:22px;background:var(--surface);border:1px solid var(--line);color:var(--fg);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
.lcard:hover{text-decoration:none;transform:translateY(-3px);box-shadow:var(--shadow)}
.lcard .n{font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--uc);font-variant-numeric:tabular-nums}
.lcard h4{margin:auto 0 0;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.3}
.lcard p{font-size:14px;color:var(--muted);line-height:1.45}
.lcard .lab{font-size:12px;font-weight:600;color:var(--uc);margin-top:6px}
.lcard .done{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--uc);color:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:800}

.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.tile{grid-column:span 2;padding:26px;border-radius:24px;background:var(--surface);border:1px solid var(--line);color:var(--fg);display:flex;flex-direction:column;gap:8px;min-width:0}
.tile:hover{text-decoration:none;box-shadow:var(--shadow)}
.tile.w3{grid-column:span 3}
.tile h4{margin:0;font-size:22px;letter-spacing:-.03em;line-height:1.25}
.tile p{color:var(--muted);font-size:15px}
.tile .go{margin-top:auto;font-size:14px;font-weight:600;color:var(--accent)}
.tile.dark{background:var(--fg);color:var(--bg);border-color:transparent}
.tile.dark p{color:color-mix(in srgb,var(--bg) 70%,var(--fg))}
.tile.dark .go{color:var(--bg)}
@media (max-width:820px){.tile,.tile.w3{grid-column:span 3}}
@media (max-width:560px){.bento{grid-template-columns:1fr}.tile,.tile.w3{grid-column:auto}}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.links a{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface2);color:var(--fg)}
.tile.dark .links a{background:color-mix(in srgb,var(--bg) 16%,var(--fg));color:var(--bg)}

/* lesson page */
.lhero{padding-block:56px 28px}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb b{color:var(--uc)}
.lhero h1{font-size:clamp(36px,6vw,64px);font-weight:800;margin-top:14px}
.lhero .tag{font-size:clamp(18px,2.4vw,24px);color:var(--muted);margin-top:12px;letter-spacing:-.02em}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:32px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;font-size:15px;line-height:1.5;min-width:0}
.goal b{display:block;font-size:12px;color:var(--uc);margin-bottom:6px;letter-spacing:.02em}
@media (max-width:720px){.goals{grid-template-columns:1fr}}
.block{padding-block:36px}
.block>h2{font-size:clamp(26px,3.4vw,36px);font-weight:800;margin-bottom:18px}
.prose{max-width:720px;display:grid;gap:16px}
.prose p,.prose li{font-size:17px;line-height:1.75}
.prose strong{color:var(--fg)}
.prose ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.flow span{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600}
.flow span em{font-style:normal;color:var(--uc);margin-right:6px;font-variant-numeric:tabular-nums}
.flow i{color:var(--muted);font-style:normal}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.wrap{white-space:normal;min-width:220px}
.formula{font-family:var(--mono);font-size:14px;background:var(--surface2);border-radius:12px;padding:12px 14px;overflow-x:auto;white-space:pre}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys span{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

.labcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.lab-h{padding:22px 24px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.lab-h h3{font-size:22px;font-weight:700}
.lab-h p{color:var(--muted);font-size:14px;margin-top:4px;max-width:560px}
.lab-b{padding:20px 24px 24px;display:grid;gap:18px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 22px;align-items:end}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:14px;padding:12px 14px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.hi{background:color-mix(in srgb,var(--uc) 14%,var(--surface))}
.stat.hi b{color:var(--uc)}
.plot{width:100%;border-radius:16px;background:var(--surface2);overflow:hidden}
.plot canvas{display:block;width:100%}
.note{font-size:13px;color:var(--muted)}
.msg{font-size:15px;padding:12px 14px;border-radius:14px;background:var(--surface2)}
.msg.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));}
.msg.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));}

.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.qc{background:var(--surface2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qc p{font-weight:600;font-size:16px;line-height:1.45}
.qc .row .btn{flex:1;justify-content:center}
.qc .fb{font-size:14px;line-height:1.5}
.qc.ok{box-shadow:inset 0 0 0 2px var(--good)}
.qc.no{box-shadow:inset 0 0 0 2px var(--bad)}
.qc .fb b{display:block}

.json{font-family:var(--mono);font-size:12.5px;line-height:1.65;background:var(--surface2);border-radius:14px;padding:14px;overflow:auto;max-height:340px;white-space:pre}
.json .k{color:var(--c4)} .json .s{color:var(--c3)} .json .blk{border-radius:6px;transition:background .2s;display:inline}
.json .blk.hl{background:color-mix(in srgb,var(--accent) 18%,transparent)}
tr.hl td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
tr.top td{background:color-mix(in srgb,var(--c2) 16%,transparent)}

.cells{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:520px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{background:var(--surface2);border-radius:12px;padding:8px;text-align:center;font-variant-numeric:tabular-nums}
.cell span{display:block;font-size:11px;color:var(--muted)}
.cell b{font-size:17px}
.cell.miss b{color:var(--muted)}
.cell.out{box-shadow:inset 0 0 0 2px var(--c2)}
.cell.gone{opacity:.35;text-decoration:line-through}
.cell.fill b{color:var(--accent);font-style:italic}

.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:13px;max-width:420px}
.cm div{border-radius:12px;padding:10px;text-align:center}
.cm .h{color:var(--muted);font-weight:600;align-self:center}
.cm .v{background:var(--surface2);font-variant-numeric:tabular-nums}
.cm .v b{display:block;font-size:24px}
.cm .v.t{background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.cm .v.f{background:color-mix(in srgb,var(--bad) 13%,var(--surface))}

.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}

.prompt{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.prompt-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:600}
.prompt pre{margin:0;padding:16px;font-family:var(--mono);font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.think{display:grid;gap:10px;max-width:720px}
.think li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px}
.think{padding:0;margin:0}
.pager{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;padding-block:24px 64px;border-top:1px solid var(--line);margin-top:24px;align-items:center}
.pager a{display:flex;flex-direction:column;font-size:13px;color:var(--muted);min-width:0}
.pager a b{font-size:17px;color:var(--fg)}
.pager a:hover{text-decoration:none}
.pager a:hover b{color:var(--accent)}

.search{width:100%;max-width:420px;font:inherit;font-size:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:20px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.gi h4{margin:0 0 4px;font-size:17px;letter-spacing:-.02em}
.gi p{font-size:14.5px;color:var(--muted);line-height:1.55}
.gi a{font-size:12px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.step em{font-style:normal;font-weight:800;font-size:28px;color:var(--accent);letter-spacing:-.04em}
.step h4{margin:6px 0;font-size:18px}
.step p{font-size:14.5px;color:var(--muted)}
.check{display:grid;gap:8px;max-width:720px}
.check label{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:15.5px}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
footer{border-top:1px solid var(--line);padding-block:28px 40px;font-size:12px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<a class="sr" href="#app" style="position:absolute;left:-999px">본문 바로가기</a>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="#home"><i></i>경북여고 정보 <small>데이터 · 인공지능</small></a>
    <nav aria-label="주 메뉴">
      <a href="#units" data-nav="units">수업</a>
      <a href="#labs" data-nav="labs">실험실</a>
      <a href="#glossary" data-nav="glossary">용어사전</a>
      <a href="#project" data-nav="project">프로젝트</a>
    </nav>
  </div>

/* 히어로: 같은 점들을 회귀 · 군집 · 분류로 다르게 읽기 */
function buildHero(stage){
  let mode='reg';const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const read=h('span',{class:'read'});
  const caps={reg:'회귀 — 점들을 가장 잘 대표하는 직선을 찾습니다. 그래프를 누르면 점이 추가되고 직선이 다시 학습됩니다.',clu:'군집 — 레이블 없이 가까운 점끼리 세 무리로 묶습니다. 중심(◆)이 매 순간 소속 점들의 평균으로 이동합니다.',cls:'분류 — 가까운 이웃 5개의 다수결로 영역을 칠합니다. 커서를 움직여 그 위치의 예측을 확인하세요. 누를 때마다 두 범주의 점이 번갈아 추가됩니다.'};
  const cap=h('div',{class:'stage-cap'},caps.reg);
  stage.append(h('div',{class:'stage-bar'},seg([['reg','회귀'],['clu','군집'],['cls','분류']],'reg',v=>{mode=v;cap.textContent=caps[v];}),read));
  const c=h('canvas',{'aria-label':'점을 회귀, 군집, 분류로 보여 주는 인터랙티브 그래프',role:'img'});stage.append(c,cap);
  const ctx=c.getContext('2d');
  const r=rng(2026);const pts=[];
  [[.2,.28,0],[.5,.52,-1],[.8,.76,1]].forEach(([cx,cy,lab],bi)=>{for(let i=0;i<16;i++){const x=cx+gauss(r)*.07,y=cy+gauss(r)*.08;pts.push({x,y,c:lab<0?(x+gauss(r)*.03<.5?0:1):lab,ph:r()*6.28});}});
  let cents=[[.3,.6],[.6,.3],[.7,.8]].map(([x,y])=>({x,y,dx:x,dy:y}));
  let mouse=null,addLab=0,W=0,H=0,raf=0,t=0;
  function size(){const w=stage.clientWidth;const hh=Math.round(Math.min(Math.max(w*.5,260),400));const d=devicePixelRatio||1;c.width=w*d;c.height=hh*d;c.style.height=hh+'px';ctx.setTransform(d,0,0,d,0,0);W=w;H=hh;}
  const ro=new ResizeObserver(()=>{size();if(reduce)draw();});ro.observe(stage);size();
  const P=p=>({x:24+p.x*(W-48),y:H-20-p.y*(H-40)});
  c.addEventListener('pointermove',e=>{const b=c.getBoundingClientRect();mouse={x:(e.clientX-b.left-24)/(W-48),y:(H-20-(e.clientY-b.top))/(H-40)};if(reduce)draw();});
  c.addEventListener('pointerleave',()=>{mouse=null;if(reduce)draw();});
  c.addEventListener('click',e=>{const b=c.getBoundingClientRect();const x=(e.clientX-b.left-24)/(W-48),y=(H-20-(e.clientY-b.top))/(H-40);pts.push({x,y,c:addLab,ph:r()*6.28});addLab^=1;if(reduce)draw();});
  function knn(x,y,k){const ds=cur.map(p=>[(p.x-x)**2+(p.y-y)**2,p.c]).sort((a,b)=>a[0]-b[0]).slice(0,k);return ds.filter(d=>d[1]===1).length>k/2?1:0;}
  let cur=[];
  function draw(){
    t+=0.016;
    cur=pts.map(p=>({x:p.x+(reduce?0:Math.sin(t*.7+p.ph)*.006),y:p.y+(reduce?0:Math.cos(t*.6+p.ph)*.006),c:p.c}));
    ctx.clearRect(0,0,W,H);
    const cA=C('c1'),cB=C('c2'),cC=C('c3'),fg=C('fg'),mu=C('muted');
    ctx.strokeStyle=C('grid');ctx.lineWidth=1;
    for(let i=0;i<=10;i++){const y=20+i*(H-40)/10;ctx.beginPath();ctx.moveTo(24,y);ctx.lineTo(W-24,y);ctx.stroke();}
    if(mode==='reg'){
      const f=lsq(cur.map(p=>[p.x,p.y]));
      ctx.strokeStyle=alpha(C('bad'),.45);ctx.lineWidth=1.2;
      cur.forEach(p=>{const a=P(p),b=P({x:p.x,y:f.a*p.x+f.b});ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});
      cur.forEach(p=>{const a=P(p);dot(ctx,a.x,a.y,4.5,fg);});
      const p0=P({x:-.02,y:f.a*-.02+f.b}),p1=P({x:1.02,y:f.a*1.02+f.b});
      ctx.strokeStyle=C('accent');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
      read.textContent=`점 ${cur.length}개 · 상관계수 r = ${fx(f.r,2)} · ŷ = ${fx(f.a,2)}x ${f.b>=0?'+':'−'} ${fx(Math.abs(f.b),2)}`;
    }else if(mode==='clu'){
      const as=cur.map(p=>{let bi=0,bd=1e9;cents.forEach((q,i)=>{const d=(p.x-q.x)**2+(p.y-q.y)**2;if(d<bd){bd=d;bi=i;}});return bi;});
      cents.forEach((q,i)=>{const m=cur.filter((_,j)=>as[j]===i);if(m.length){q.x=m.reduce((s,p)=>s+p.x,0)/m.length;q.y=m.reduce((s,p)=>s+p.y,0)/m.length;}q.dx+=(q.x-q.dx)*.08;q.dy+=(q.y-q.dy)*.08;});
      const cols=[cA,cB,cC];
      cur.forEach((p,j)=>{const a=P(p),q=P({x:cents[as[j]].dx,y:cents[as[j]].dy});ctx.strokeStyle=alpha(cols[as[j]],.22);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(q.x,q.y);ctx.stroke();});
      cur.forEach((p,j)=>{const a=P(p);dot(ctx,a.x,a.y,4.5,cols[as[j]]);});
      cents.forEach((q,i)=>{const a=P({x:q.dx,y:q.dy});ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.PI/4);ctx.fillStyle=cols[i];ctx.strokeStyle=C('surface');ctx.lineWidth=3;ctx.fillRect(-8,-8,16,16);ctx.strokeRect(-8,-8,16,16);ctx.restore();});
      const sse=cur.reduce((s,p,j)=>s+(p.x-cents[as[j]].x)**2+(p.y-cents[as[j]].y)**2,0);
      read.textContent=`k = 3 · 군집 크기 ${[0,1,2].map(i=>as.filter(a=>a===i).length).join(' / ')} · 군집 내 제곱합 ${fx(sse,3)}`;
    }else{
      const cs=16;
      for(let gx=24;gx<W-24;gx+=cs)for(let gy=20;gy<H-20;gy+=cs){const x=(gx+cs/2-24)/(W-48),y=(H-20-(gy+cs/2))/(H-40);ctx.fillStyle=alpha(knn(x,y,5)?cB:cA,.13);ctx.fillRect(gx,gy,cs,cs);}
      cur.forEach(p=>{const a=P(p);dot(ctx,a.x,a.y,4.5,p.c?cB:cA,C('surface'),1.5);});
      if(mouse){const pr=knn(mouse.x,mouse.y,5);const ns=cur.map(p=>[(p.x-mouse.x)**2+(p.y-mouse.y)**2,p]).sort((a,b)=>a[0]-b[0]).slice(0,5);const m=P(mouse);
        ctx.strokeStyle=mu;ctx.lineWidth=1;ns.forEach(([,p])=>{const a=P(p);ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(a.x,a.y);ctx.stroke();});
        dot(ctx,m.x,m.y,8,pr?cB:cA,fg,2.5);read.textContent=`k = 5 · 커서 위치 예측: ${pr?'주황':'파랑'} (이웃 ${ns.filter(n=>n[1].c===pr).length}/5)`;}
      else read.textContent=`k = 5 · 점 ${cur.length}개 · 그래프 위로 커서를 움직여 보세요`;
    }
  }
  function loop(){draw();raf=requestAnimationFrame(loop);}
  if(reduce)draw();else loop();
  return()=>{cancelAnimationFrame(raf);ro.disconnect();};
}

LABS.clean=root=>{
  const raw=[6.5,7,null,5.5,6,24,7.5,6,null,5,6.5,0.5];
  let miss='drop',out='keep';
  const isOut=v=>v!=null&&(v<3||v>12);
  const cells=h('div',{class:'cells'});
  const sN=stat('사용한 값'),sM=stat('평균 (시간)',true),sMed=stat('중앙값 (시간)');
  const msg=h('div',{class:'msg'});
  const pl=plot(root,.22,150,(ctx,W,H)=>{const F=frame(ctx,W,H,{x0:0,x1:25,y0:0,y1:1,xt:[0,3,6,9,12,15,18,21,24],xf:v=>v+'h',b:30,l:20,r:20,t:10});
    const {vals,info}=compute();
    ctx.fillStyle=alpha(C('c2'),.10);ctx.fillRect(F.X(0),10,F.X(3)-F.X(0),H-40);ctx.fillRect(F.X(12),10,F.X(25)-F.X(12),H-40);
    info.forEach((c,i)=>{if(c.v==null||c.gone)return;const y=F.Y(.5)+((i%3)-1)*10;dot(ctx,F.X(c.v),y,6,c.filled?C('accent'):C('fg'),C('surface'),1.5);});
    const m=vals.reduce((s,v)=>s+v,0)/vals.length;ctx.strokeStyle=C('accent');ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(F.X(m),10);ctx.lineTo(F.X(m),H-30);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C('accent');ctx.font='600 12px '+FONT();ctx.textAlign=m>20?'right':'left';ctx.textBaseline='top';ctx.fillText(' 평균 '+fx(m,2)+'h ',F.X(m),12);});
  function compute(){
    let info=raw.map(v=>({v,gone:false,filled:false,out:isOut(v)}));
    if(out==='drop')info.forEach(c=>{if(c.out)c.gone=true;});
    const base=info.filter(c=>c.v!=null&&!c.gone).map(c=>c.v);
    const mean=base.reduce((s,v)=>s+v,0)/base.length;
    info.forEach(c=>{if(c.v==null){if(miss==='drop')c.gone=true;else{c.filled=true;c.v=miss==='mean'?Math.round(mean*100)/100:0;}}});
    const vals=info.filter(c=>!c.gone).map(c=>c.v);return{info,vals};
  }
  function update(){
    const {info,vals}=compute();cells.innerHTML='';
    info.forEach((c,i)=>{const o=raw[i];cells.append(h('div',{class:'cell'+(o==null?' miss':'')+(isOut(o)?' out':'')+(c.gone?' gone':'')+(c.filled?' fill':'')},h('span',null,`${i+1}번`),h('b',null,c.filled?fx(c.v,2):o==null?'빈칸':o)));});
    const s=[...vals].sort((a,b)=>a-b),n=s.length,med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,mean=vals.reduce((a,b)=>a+b,0)/n;
    sN.set(n+'개');sM.set(fx(mean,2));sMed.set(fx(med,2));
    const cases={'drop-keep':['bad','이상치 24시간과 0.5시간이 남아 평균이 흔들립니다. 중앙값과 비교해 보세요.'],'drop-drop':['good','결측 행과 이상치(3시간 미만·12시간 초과)를 빼면 평균과 중앙값이 비슷해집니다. 기준을 보고서에 함께 적어야 합니다.'],'mean-keep':['bad','이상치가 포함된 평균으로 빈칸을 채웠습니다. 채운 값 자체가 왜곡되어 있어요.'],'mean-drop':['good','이상치를 뺀 뒤 평균으로 채웠습니다. 데이터 수는 유지되지만 값이 평균 근처로 몰려 퍼짐이 작아 보입니다.'],'zero-keep':['bad','빈칸을 0시간으로 채우면 "한숨도 안 잔 학생"이 두 명 생깁니다. 평균이 실제보다 낮아집니다.'],'zero-drop':['bad','이상치는 뺐지만 빈칸을 0으로 채워 평균이 낮아졌습니다. 0은 "모름"이 아니라 실제 값으로 계산됩니다.']};
    const [k,t]=cases[miss+'-'+out];msg.className='msg '+k;msg.textContent=t;pl.redraw();
  }
  const ctr=h('div',{class:'ctrls'},
    h('div',null,h('div',{class:'sl-l',style:'font-size:14px;margin-bottom:6px'},'결측치 처리'),seg([['drop','행 삭제'],['mean','평균으로 채우기'],['zero','0으로 채우기']],miss,v=>{miss=v;update();})),
    h('div',null,h('div',{class:'sl-l',style:'font-size:14px;margin-bottom:6px'},'이상치 (3시간 미만 · 12시간 초과)'),seg([['keep','그대로 두기'],['drop','제외하기']],out,v=>{out=v;update();})));
  root.prepend(ctr,cells);root.append(h('div',{class:'stats'},sN,sM,sMed),msg,h('p',{class:'note'},'주황 테두리: 이상치 후보 · 파란 기울임 숫자: 채워 넣은 값 · 점선: 현재 평균'));
  update();
};

    cents.forEach((c,i)=>{ctx.save();ctx.translate(F.X(c.x),F.Y(c.y));ctx.rotate(Math.PI/4);ctx.fillStyle=cs[i];ctx.strokeStyle=C('fg');ctx.lineWidth=2.5;ctx.fillRect(-9,-9,18,18);ctx.strokeRect(-9,-9,18,18);ctx.restore();});});
  function update(){sI.set(iter+'회');const s=sse();sS.set(s==null?'–':fx(s,1));sP.set(phase==='assign'?'점 할당':phase==='update'?'중심 이동':'수렴 완료');
    msg.className='msg'+(phase==='done'?' good':'');msg.textContent=phase==='done'?`${iter}번 반복 후 중심이 더 이상 움직이지 않습니다. ‘다른 시작점’을 눌러 결과가 같은지 확인해 보세요.`:phase==='assign'?'다음 단계: 모든 점을 가장 가까운 중심(◆)의 색으로 칠합니다.':'다음 단계: 각 중심을 같은 색 점들의 평균 위치로 옮깁니다. 점선은 중심이 지나온 길입니다.';pl.redraw();}
  function stopAuto(){clearInterval(timer);timer=0;auto.textContent='끝까지 실행';}
  const one=h('button',{type:'button',class:'btn sm'},'한 단계');one.addEventListener('click',()=>{stopAuto();step();});
  const auto=h('button',{type:'button',class:'btn sm soft'},'끝까지 실행');auto.addEventListener('click',()=>{if(timer){stopAuto();return;}auto.textContent='멈춤';timer=setInterval(()=>{if(!step()||!root.isConnected)stopAuto();},450);});
  const re=h('button',{type:'button',class:'btn sm ghost'},'다른 시작점');re.addEventListener('click',()=>{seed+=0;const r=rng(Date.now()%1e6);cents=cents.map(()=>{const p=pts[Math.floor(r()*pts.length)];return{x:p.x,y:p.y};});trail=cents.map(c=>[{...c}]);asg=pts.map(()=>-1);phase='assign';iter=0;stopAuto();update();});
  const nd=h('button',{type:'button',class:'btn sm ghost'},'새 데이터');nd.addEventListener('click',()=>{seed++;gen();});
  root.prepend(h('div',{class:'ctrls'},h('div',null,h('div',{class:'sl-l',style:'font-size:14px;margin-bottom:6px'},'군집 개수 k'),seg([[2,'2'],[3,'3'],[4,'4'],[5,'5']],3,v=>{k=v;reset();})),h('div',{class:'row'},one,auto,re,nd)));
  root.append(h('div',{class:'stats'},sI,sP,sS),msg);
  gen();
};

LABS.perc=root=>{
  const T={AND:[0,0,0,1],OR:[0,1,1,1],NAND:[1,1,1,0],XOR:[0,1,1,0]};const X=[[0,0],[0,1],[1,0],[1,1]];
  let tg='AND',w1=.5,w2=.5,b=-.2,timer=0,epoch=0;
  const tb=h('tbody');const msg=h('div',{class:'msg'});
  const out=(x)=>w1*x[0]+w2*x[1]+b>=0?1:0;
  const pl=plot(root,.8,320,(ctx,W,H)=>{const F=frame(ctx,W,H,{x0:-.5,x1:1.5,y0:-.5,y1:1.5,xt:[0,1],yt:[0,1],xl:'x₁',yl:'x₂',l:36});
    const cs=10;for(let gx=F.p.l;gx<W-F.p.r;gx+=cs)for(let gy=F.p.t;gy<H-F.p.b;gy+=cs){const x=F.ix(gx+cs/2),y=F.iy(gy+cs/2);ctx.fillStyle=alpha(w1*x+w2*y+b>=0?C('c2'):C('c1'),.12);ctx.fillRect(gx,gy,cs,cs);}
    if(Math.abs(w2)>1e-6||Math.abs(w1)>1e-6){ctx.save();ctx.beginPath();ctx.rect(F.p.l,F.p.t,W-F.p.l-F.p.r,H-F.p.t-F.p.b);ctx.clip();ctx.strokeStyle=C('fg');ctx.lineWidth=2.5;ctx.beginPath();
      if(Math.abs(w2)>1e-6){ctx.moveTo(F.X(-.5),F.Y((-b-w1*-.5)/w2));ctx.lineTo(F.X(1.5),F.Y((-b-w1*1.5)/w2));}else{const x=-b/w1;ctx.moveTo(F.X(x),F.Y(-.5));ctx.lineTo(F.X(x),F.Y(1.5));}ctx.stroke();ctx.restore();}
    X.forEach((x,i)=>{const tgt=T[tg][i],ok=out(x)===tgt;dot(ctx,F.X(x[0]),F.Y(x[1]),13,tgt?C('c2'):C('c1'),ok?C('surface'):C('bad'),ok?2:4);ctx.fillStyle=C('surface');ctx.font='700 12px '+FONT();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(tgt,F.X(x[0]),F.Y(x[1]));});});
  function update(){tb.innerHTML='';let c=0;X.forEach((x,i)=>{const s=w1*x[0]+w2*x[1]+b,o=s>=0?1:0,tgt=T[tg][i],ok=o===tgt;if(ok)c++;tb.append(h('tr',null,h('td',null,x[0]),h('td',null,x[1]),h('td',null,fx(s,2)),h('td',null,h('b',null,o)),h('td',null,tgt),h('td',{style:`color:var(${ok?'--good':'--bad'});font-weight:700`},ok?'맞음':'틀림')));});
    msg.className='msg '+(c===4?'good':'');msg.textContent=c===4?`${tg} 완성! 경계 직선 하나로 1과 0이 깔끔하게 나뉘었습니다.`:tg==='XOR'&&epoch>=30?`${epoch} 에포크가 지나도 ${c}/4에서 멈췄습니다. XOR의 1(주황)과 0(파랑)은 직선 하나로 나눌 수 없어요. 퍼셉트론을 여러 층으로 쌓아야 합니다.`:`${c} / 4 맞힘${epoch?` · ${epoch} 에포크`:''}`;pl.redraw();}
  const sw1=slider('p-w1','가중치 w₁',-2,2,.1,w1,v=>fx(v,1),v=>{w1=v;update();});
  const sw2=slider('p-w2','가중치 w₂',-2,2,.1,w2,v=>fx(v,1),v=>{w2=v;update();});
  const sb=slider('p-b','편향 b',-3,3,.1,b,v=>fx(v,1),v=>{b=v;update();});
  function stop(){clearInterval(timer);timer=0;tr.textContent='자동 학습';}
  const tr=h('button',{type:'button',class:'btn sm'},'자동 학습');
  tr.addEventListener('click',()=>{if(timer){stop();return;}w1=0;w2=0;b=0;epoch=0;tr.textContent='멈춤';timer=setInterval(()=>{let err=0;X.forEach((x,i)=>{const e=T[tg][i]-out(x);if(e){err++;w1+=.1*e*x[0];w2+=.1*e*x[1];b+=.1*e;}});w1=Math.round(w1*10)/10;w2=Math.round(w2*10)/10;b=Math.round(b*10)/10;epoch++;sw1.setVal(w1);sw2.setVal(w2);sb.setVal(b);update();if(!err||epoch>=30||!root.isConnected)stop();},220);});
  root.prepend(h('div',{class:'row'},h('span',{class:'sl-l',style:'font-size:14px'},'목표 연산'),seg([['AND','AND'],['OR','OR'],['NAND','NAND'],['XOR','XOR']],tg,v=>{tg=v;epoch=0;stop();update();}),tr),h('div',{class:'ctrls'},sw1,sw2,sb));
  root.append(h('div',{class:'split'},h('div',{class:'tbl'},h('table',null,h('thead',null,h('tr',null,...['x₁','x₂','가중합','출력','정답',''].map(t=>h('th',null,t)))),tb)),msg));
  update();
};

LABS.bias=root=>{
  let share=.85,evalMode='mirror';
  const acc=s=>.55+.40*(1-Math.exp(-s*5));
  const sAll=stat('전체 정확도',true),sA=stat('집단 A 정확도'),sB=stat('집단 B 정확도'),sG=stat('정확도 차이');
  const msg=h('div',{class:'msg'});
  const pl=plot(root,.36,240,(ctx,W,H)=>{const aA=acc(share),aB=acc(1-share),all=evalMode==='mirror'?share*aA+(1-share)*aB:(aA+aB)/2;
    const F=frame(ctx,W,H,{x0:0,x1:1,y0:0,y1:3,l:110,r:60,b:30,xt:[0,.25,.5,.75,1],xf:v=>v*100+'%'});
    [['전체',all,C('fg')],['집단 A',aA,C('c1')],['집단 B',aB,C('c2')]].forEach(([lab,v,col],i)=>{const y=F.Y(2.5-i),hh=(F.Y(0)-F.Y(1))*.5;ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(F.X(0),y-hh/2,F.X(v)-F.X(0),hh,6);ctx.fill();
      ctx.fillStyle=C('muted');ctx.font='600 13px '+FONT();ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(lab,F.p.l-10,y);ctx.fillStyle=C('fg');ctx.textAlign='left';ctx.fillText(fx(v*100,1)+'%',F.X(v)+8,y);});});
  function update(){const aA=acc(share),aB=acc(1-share),all=evalMode==='mirror'?share*aA+(1-share)*aB:(aA+aB)/2;
    sAll.set(fx(all*100,1)+'%');sA.set(fx(aA*100,1)+'%');sB.set(fx(aB*100,1)+'%');sG.set(fx(Math.abs(aA-aB)*100,1)+'%p');
    const gap=Math.abs(aA-aB);msg.className='msg '+(gap>.1?'bad':gap>.03?'':'good');
    msg.textContent=gap<=.03?'두 집단의 데이터가 고르게 들어가 정확도 차이가 작습니다.':evalMode==='mirror'?`전체 정확도 ${fx(all*100,1)}%만 보면 괜찮아 보이지만, 집단 B는 ${fx(aB*100,1)}%에 그칩니다. 평가 데이터도 A가 많아 B의 낮은 성능이 가려졌어요.`:`두 집단을 같은 수로 평가하자 숨어 있던 차이(${fx(gap*100,1)}%p)가 전체 정확도를 끌어내립니다.`;pl.redraw();}
  root.prepend(h('div',{class:'ctrls'},slider('b-s','학습 데이터 중 집단 A의 비율',.5,.97,.01,share,v=>`A ${fx(v*100,0)}% · B ${fx(100-v*100,0)}%`,v=>{share=v;update();}),
    h('div',null,h('div',{class:'sl-l',style:'font-size:14px;margin-bottom:6px'},'평가 데이터 구성'),seg([['mirror','학습 데이터와 같은 비율'],['equal','두 집단 같은 수']],evalMode,v=>{evalMode=v;update();}))));
  root.append(h('div',{class:'stats'},sAll,sA,sB,sG),msg,h('p',{class:'note'},'가상 시뮬레이션입니다. 데이터가 적은 집단일수록 정확도가 낮아지는 경향을 단순한 식으로 나타냈으며, 실제 서비스의 수치가 아닙니다.'));
  update();
};
